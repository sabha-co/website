name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: EMDASH_SITE_URL=https://sabha.co
          tags: |
            ghcr.io/sabha-co/sabha-blog:latest
            ghcr.io/sabha-co/sabha-blog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
