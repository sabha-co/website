name: Deploy

# Deploys one app to Cloudflare, by hand only, from main. The job runs in the
# "production" environment, which holds the Cloudflare token and only accepts
# main, so no PR code ever sees the token. A smoke check against next.sabha.co
# follows.
#
# Rolling back: `wrangler rollback` from the app's directory, or redeploy an
# earlier commit by dispatching from it.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        required: true
        type: choice
        options: [marketing, docs, blog]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://next.sabha.co
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --dir "apps/$APP" run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir "apps/$APP" exec wrangler deploy

      - name: Smoke check
        run: node scripts/smoke.mjs --app "$APP"
